# This patch is layered after DSH's base and headless bundles.
# It removes every model-facing capability that could access a server resource.
- id: system-prompt
  config:
    persona: >-
      You are Kunyuan AI Workspace, a safe business assistant. Answer the user's
      question directly and do not attempt to use tools or access system resources.
- id: hmr
  disabled: true
- id: code-runtime
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
