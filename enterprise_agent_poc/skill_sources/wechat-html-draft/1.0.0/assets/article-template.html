<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章标题</title>
</head>
<body style="margin:0;background-color:#ffffff;">
<main style="max-width:640px;margin:0 auto;padding:28px 20px 48px;box-sizing:border-box;">
  <header style="margin:0 0 28px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">
    <h1 style="font-size:22px;line-height:1.5;color:#202020;margin:0;">文章标题</h1>
  </header>
  <section id="article" style="color:#3e3e3e;font-family:Optima-Regular,PingFangTC-light,'PingFang SC','Microsoft YaHei',sans-serif;font-size:16px;line-height:1.6;letter-spacing:0.544px;text-align:justify;overflow-wrap:break-word;">
    <!-- 用户提供或授权生成封面后，可在这里添加首图；无图片时省略。 -->
    <p style="margin:0 0 18px;">这里放置用户提供的首段文字。</p>
    <p style="margin:0 0 28px;">按原文内容组织短段落，保留事实与含义。</p>
    <section style="margin:38px 0 42px;text-align:right;">
      <p style="font-size:24px;line-height:1.6;margin:0;">从本文提取重点短句，</p>
      <p style="font-size:24px;line-height:1.6;color:#ffca00;margin:0;">只强调少量关键词。</p>
    </section>
    <p style="margin:0 0 18px;">这里继续展开原文，不为了适配模板新增事实。</p>
    <!-- 图片模块可使用 img + p 图注；路径必须指向真实存在的文章资产。 -->
    <section style="margin:40px 0 38px;padding:24px 22px;border:1px solid #eadfae;border-top:5px solid #ffca00;background-color:#fffdf4;box-sizing:border-box;">
      <p style="margin:0 0 16px;font-size:22px;line-height:1.6;text-align:left;">适合本文的行动或案例模块</p>
      <p style="margin:0;text-align:left;">没有对应内容时删除整个模块。</p>
    </section>
    <p style="margin:0 0 18px;">用原文结尾收束。</p>
  </section>
</main>
</body>
</html>
