services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      platform-mcp:
        condition: service_started
    networks: [internal]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      platform-mcp:
        condition: service_started
    networks: [internal]

  platform-mcp:
    build: .
    restart: unless-stopped
    env_file: .env.production
    command: python -m app.platform_mcp.server
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_agent}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set in .env.production}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/workbench.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
