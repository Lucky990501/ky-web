<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src about:; base-uri 'none'; form-action 'none'; connect-src 'none'; img-src 'none'">
<title>公众号文章人工排版工具 · 本地离线</title>
<style>
:root{--ink:#25334b;--muted:#53657e;--line:#dce5f7;--primary:#315fe5;--shadow:0 12px 40px #1b355226}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f5f8ff;font:16px/1.6 system-ui,sans-serif}#app{max-width:1160px;margin:auto;padding:28px 24px}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 16px}.muted{color:var(--muted);font-size:14px}.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:24px}.editor-pane{min-width:0;background:white;padding:20px;border:1px solid var(--line);border-radius:12px}label{display:block;font-size:14px;margin-bottom:12px}input,textarea{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:6px;font:16px/1.6 system-ui,sans-serif;color:var(--ink);background:white}textarea{min-height:240px;resize:vertical}button{cursor:pointer}.button{border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;font:14px/1.5 system-ui,sans-serif;color:var(--ink);background:white}.primary{color:white;background:var(--primary);border-color:var(--primary)}button:disabled{opacity:.6;cursor:default}:focus-visible{outline:3px solid var(--primary);outline-offset:3px}.dialog-backdrop{position:fixed;inset:0;background:#18284666;display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}.dialog-close{position:absolute;top:10px;right:10px;min-width:44px;min-height:44px;background:white;border:0;font-size:24px}.tool-error{color:#a92727;font-size:14px;min-height:24px}.output-placeholder{color:var(--muted)}
/* SHARED_ARTICLE_CSS */
@media(max-width:700px){#app{padding:20px 16px}.editor-grid{grid-template-columns:minmax(0,1fr);gap:16px}.editor-pane{padding:16px}.dialog-backdrop{padding:12px}.button{width:100%}}
</style></head><body><div id="app"><header><h1>公众号文章人工排版工具</h1><p class="muted">本地离线 · 仅处理你粘贴的已有内容，不生成文章、不读取账号、不连接微信、不上传或保存内容。</p></header><div class="editor-grid"><section class="editor-pane"><h2>已有文章内容</h2><form id="tool-form"><label>正文（HTML、Markdown 或纯文本）<textarea id="article-input" required maxlength="262144" placeholder="粘贴已有文章正文"></textarea></label><label>标题（单独填写，可留空使用首个一级标题建议）<input id="article-title" maxlength="120"></label><label>摘要（单独填写）<input id="article-digest" maxlength="120"></label><label>封面说明（图片需在公众号后台手动上传）<input id="article-cover" maxlength="500"></label><button class="button primary" type="submit">准备安全排版</button><p class="tool-error" role="alert"></p></form></section><main class="editor-pane" id="main"><h2>人工导出</h2><div id="output"><p class="output-placeholder">准备排版后，可预览或复制到公众号编辑器。</p></div><p class="muted">请自行打开目标公众号后台 → 粘贴 → 核对标题、摘要和图片 → 保存草稿 → 重新打开检查。尚无真实公众号粘贴验收证据；不承诺样式完全一致。</p></main></div></div>
<script>
/* SHARED_ARTICLE_JS */
/* SHARED_WORKBENCH_HELPERS */
const form=document.querySelector('#tool-form'),main=document.querySelector('#main');let generation=0;
form.onsubmit=event=>{
  event.preventDefault();const error=form.querySelector('[role="alert"]');error.textContent='';
  const content=document.querySelector('#article-input').value;
  const metadata={title:document.querySelector('#article-title').value,digest:document.querySelector('#article-digest').value,cover:document.querySelector('#article-cover').value};
  try{
    WorkbenchWechatArticle.buildManualExport(content,markdownHtml,metadata);
    const instance=++generation,article=document.createElement('article');article.dataset.assistantMessageId='local-article';
    document.querySelector('#output').replaceChildren(article);
    WorkbenchWechatArticle.mountManual({main,article,agent:{slug:'wechat-official-account-writing'},messageId:'local-article',content,metadata,markdown:markdownHtml,modal:bindModalDialog,isCurrent:()=>generation===instance});
  }catch{error.textContent='文章为空、过大或无有效正文，请检查后重试。';}
};
</script></body></html>
