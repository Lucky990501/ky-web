[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent-poc"
version = "0.1.0"
description = "Tenant-isolated Codex Harness proof of concept for the enterprise AI Agent platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.0,<2",
  "openai-codex==0.147.0",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "oss2>=2.19,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
